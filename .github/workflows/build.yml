name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
      # Tell Bing which pages changed, once Netlify has had time to publish them.
      - name: IndexNow
        if: github.ref == 'refs/heads/site-rebuild' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          sleep 150
          node scripts/indexnow.mjs ${{ github.event_name == 'workflow_dispatch' && 'all' || '' }}

  # Google Lighthouse scores for the key pages. Reports only; never blocks a deploy.
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/site-rebuild' && github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Lighthouse
        run: |
          npx -y @lhci/cli@0.14.x collect --staticDistDir=dist --numberOfRuns=3 \
            --url=http://localhost/index.html \
            --url=http://localhost/ai-agents/index.html \
            --url=http://localhost/case-studies/index.html \
            --url=http://localhost/insights/index.html \
            --url=http://localhost/technologies/index.html \
            --url=http://localhost/contact/index.html
          node scripts/lighthouse-summary.mjs
